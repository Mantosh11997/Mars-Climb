name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        type: choice
        options: [release, debug]
        default: release
      split_per_abi:
        description: 'Also build per-ABI APKs (smaller downloads)'
        type: boolean
        default: false

# Pinned deliberately. flame 1.18.0 / flame_forge2d 0.18.2 are from the
# Flutter 3.22-3.24 era; newer Flutter releases have broken Flame builds
# before. Bump this in step with the packages, not ahead of them.
env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Flutter doctor
        run: flutter doctor -v

      # The repo intentionally holds only lib/ and assets/ - no platform
      # folders. Generate the Android host project on the fly.
      #
      # `flutter create` can touch tracked files (pubspec.yaml, and in some
      # versions lib/main.dart), which would silently drop our pinned
      # dependency versions, the assets block, or the whole game. So we let
      # it write whatever it wants, then hand every *tracked* file back to
      # git - keeping only the newly generated, untracked android/ tree.
      - name: Generate Android platform files
        run: |
          set -euo pipefail

          # `git checkout -- .` below discards ALL uncommitted work. That is
          # safe here because CI always starts from a clean checkout - but
          # bail out rather than destroy anything if that ever stops holding.
          if ! git diff --quiet; then
            echo "::error::working tree is dirty; refusing to run (would discard changes)"
            git status --porcelain
            exit 1
          fi

          flutter create . \
            --project-name mars_climb \
            --org com.marsclimb \
            --platforms=android

          # Hand every tracked file back to git, keeping only the newly
          # generated untracked android/ tree.
          git checkout -- .

          # flutter create also drops in a template widget test that pumps a
          # `MyApp` counter app we don't have. Left in place it fails
          # `flutter analyze` with an error that has nothing to do with our
          # code, which would bury the ones that do.
          rm -f test/widget_test.dart
          rmdir test 2>/dev/null || true

          test -d android || { echo "::error::android/ was not generated"; exit 1; }
          if ! git diff --quiet; then
            echo "::error::tracked files still modified after restore"
            git status --porcelain
            exit 1
          fi
          grep -q 'MarsClimbApp' lib/main.dart \
            || { echo "::error::lib/main.dart was clobbered"; exit 1; }

      - name: Resolve dependencies
        run: flutter pub get

      # Non-blocking on purpose: the analyzer output is the most useful
      # diagnostic this workflow produces, and we still want the compile
      # errors from the build step in the same run rather than one per push.
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      # The preview test is excluded: it renders PNGs for eyeballing rather
      # than asserting anything.
      - name: Test
        id: test
        run: flutter test --exclude-tags=preview

      - name: Build APK
        id: build
        run: |
          set -euo pipefail
          MODE='${{ github.event.inputs.build_mode || 'release' }}'
          echo "Building in $MODE mode"
          flutter build apk --"$MODE"

      - name: Build per-ABI APKs
        if: ${{ github.event.inputs.split_per_abi == 'true' }}
        run: |
          set -euo pipefail
          MODE='${{ github.event.inputs.build_mode || 'release' }}'
          flutter build apk --"$MODE" --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mars-climb-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "## Mars Climb APK"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Flutter | \`${{ env.FLUTTER_VERSION }}\` |"
            echo "| Mode | \`${{ github.event.inputs.build_mode || 'release' }}\` |"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
            echo "| Analyze | ${{ steps.analyze.outcome }} |"
            echo "| Tests | ${{ steps.test.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo
            if [ -d build/app/outputs/flutter-apk ]; then
              echo "### Artifacts"
              echo
              echo '```'
              ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null \
                | awk '{print $9, "("$5")"}' || echo "none"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
