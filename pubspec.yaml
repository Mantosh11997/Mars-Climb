name: mars_climb
description: Mars Climb - a hill-climb style rover game set on Mars.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Saved progress: coins, unlocks, upgrades, best distances. One string
  # key holding JSON - see game/progress/profile_store.dart.
  shared_preferences: ^2.2.3

  # --- Pinned versions (these two must be kept compatible with each other) ---
  # flame 1.19.0 <-> flame_forge2d 0.18.2 <-> forge2d 0.13.1 (verified)
  flame: 1.19.0
  flame_forge2d: 0.18.2
  # Sound. Standalone rather than flame_audio on purpose: flame_audio is
  # pinned against the flame version, and the flame/forge2d trio above is a
  # verified set that must not be dragged forward by an audio bump.
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Drives a real FlameGame through its lifecycle in tests.
  flame_test: ^1.17.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Every file in here is generated by tool/make_sounds.py.
    - assets/audio/
